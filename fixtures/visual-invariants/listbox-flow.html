<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listbox Flow Fixture</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [role="listbox"] {
        position: static;
        width: 260px;
        border: 1px solid #becac4;
      }
      [role="option"] { padding: 10px; border-bottom: 1px solid #e0e6e2; }
    </style>
  </head>
  <body>
    <main>
      <section role="listbox" aria-label="Static choices">
        <div role="option">First option</div>
        <div role="option">Second option</div>
        <div role="option">Third option</div>
      </section>
    </main>
  </body>
</html>
