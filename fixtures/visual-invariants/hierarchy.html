<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hierarchy Fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 16px;
      }
      .card {
        box-sizing: border-box;
        width: min(320px, 100%);
        border: 1px solid #ccc;
        padding: 16px;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
      }
      .meta {
        margin-top: 8px;
        font-size: 14px;
        color: #555;
      }
      .value {
        margin-top: 20px;
        font-size: 32px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="title">Primary title</div>
      <div class="meta">Secondary metadata</div>
      <div class="value">98</div>
    </article>
  </body>
</html>
