<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generic Pills Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f4f6f4;
        color: #17211d;
      }
      main {
        padding: 24px;
      }
      .panel {
        max-width: 520px;
        border: 1px solid #ccd8d0;
        border-radius: 8px;
        background: white;
        padding: 18px;
      }
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        border: 1px solid #c4d6ce;
        border-radius: 999px;
        background: #eef6f1;
        padding: 4px 10px;
        color: #245744;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Queue summary</h1>
        <p>Decorative capsule labels should be questioned by the visual audit.</p>
        <div class="tag-row" aria-label="Decorative labels">
          <span class="chip">Fast</span>
          <span class="chip">Clean</span>
          <span class="chip">Modern</span>
        </div>
      </section>
    </main>
  </body>
</html>
